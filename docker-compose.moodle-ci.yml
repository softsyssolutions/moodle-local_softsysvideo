# Postgres for the local Moodle Plugin CI gate (scripts/ci.sh).
# Host port 5433 avoids clashing with any Postgres already running locally.
services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: postgres
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "${MOODLE_CI_PG_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
